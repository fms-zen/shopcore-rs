services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
  bank:
    build: ./bank_sim
    environment:
      APP_URL: http://app:8000
      BANK_SECRET: bank-shared-secret-2019
      BANK_LATENCY_MS: "0"
      BANK_DROP_RATE: "0"
    ports: ["5001:5001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/stats')"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      BANK_URL: http://bank:5001
      BANK_SECRET: bank-shared-secret-2019
      EXPORT_DIR: /tmp/exports
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      bank: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - exports:/tmp/exports
  test:
    profiles: ["test"]
    build:
      context: .
      target: tests
    environment:
      BASE_URL: http://app:8000
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      BANK_URL: http://bank:5001
    depends_on:
      app: { condition: service_healthy }
  dev:
    profiles: ["dev"]
    image: rust:1.91-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-cache:/usr/local/cargo
      - cargo-target:/workspace/target
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      BANK_URL: http://bank:5001
    depends_on:
      db: { condition: service_healthy }
    command: cargo test --locked
volumes:
  postgres-data:
  exports:
  cargo-cache:
  cargo-target:
